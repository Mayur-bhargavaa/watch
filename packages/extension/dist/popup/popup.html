<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SyncCinema Bridge</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0f17;
      color: #f8fafc;
    }
    h2 {
      margin: 0 0 10px 0;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #6366f1;
    }
    .status-card {
      background: #121824;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .status-val {
      font-weight: bold;
      color: #10b981;
    }
    button {
      width: 100%;
      background: #6366f1;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #4f46e5;
    }
    .footer {
      margin-top: 10px;
      font-size: 10px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <h2>🎬 SyncCinema Bridge</h2>
  <div class="status-card">
    <div class="status-row">
      <span>Detected Player:</span>
      <span id="detectedPlatform" class="status-val">Detecting...</span>
    </div>
    <div class="status-row">
      <span>Sync Status:</span>
      <span id="syncStatus" class="status-val">Inactive</span>
    </div>
  </div>

  <button id="toggleBtn">Connect to Watch Room</button>

  <div class="footer">
    Legitimate social sync layer • 0% video proxying
  </div>

  <script src="popup.js"></script>
</body>
</html>
